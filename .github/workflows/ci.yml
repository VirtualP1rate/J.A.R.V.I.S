name: CI

# Runs on the self-hosted Forgejo (git.1504.ca) runner. The Python jobs
# bootstrap python3 inside the ubuntu-latest label image via apt because
# neither actions/setup-python (GitHub-hosted tool cache) nor job-level
# `container:` images work on this runner; checkout v4 and setup-node v4
# are known-good here, so the node job keeps them.

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      # Byte-compile sources — catches syntax errors without installing deps.
      - name: compileall
        run: |
          set -e
          command -v sudo >/dev/null 2>&1 && SUDO=sudo || SUDO=
          if ! command -v python3 >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq python3 >/dev/null
          fi
          python3 --version
          python3 -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # Informational for now: the suite has known flaky / environment-dependent
    # failures (test isolation + embedding-model assertions). Tracked under the
    # ROADMAP "fresh install smoke tests" item; make this required once green.
    continue-on-error: true
    steps:
      # Plain shallow checkout. The old job did a fetch-depth-0 clone plus a
      # git-diff "docs-only change" fast path; that step failed instantly on
      # this runner and only ever saved time on markdown-only PRs — dropped.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install python + deps, run pytest
        run: |
          set -e
          python3 --version
          # A venv sidesteps PEP 668 (externally-managed-environment). The
          # runner image has python3 but no ensurepip/python3-venv, and the
          # job user can't apt-get — the virtualenv zipapp needs neither
          # (bundles its own pip, runs as any user).
          if ! python3 -m venv .venv 2>/dev/null || [ ! -x .venv/bin/pip ]; then
            echo "stdlib venv unavailable - bootstrapping virtualenv zipapp"
            rm -rf .venv
            curl -sSL https://bootstrap.pypa.io/virtualenv.pyz -o /tmp/virtualenv.pyz
            python3 /tmp/virtualenv.pyz -q .venv
          fi
          .venv/bin/pip install -q -r requirements.txt
          mkdir -p data  # sqlite DB lives at ./data/app.db
          .venv/bin/python -m pytest -q
