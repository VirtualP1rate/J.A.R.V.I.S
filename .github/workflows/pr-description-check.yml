name: ci / PR checks

# Dependency-free PR hygiene checks for the self-hosted Forgejo instance.
# The previous GitHub version used actions/github-script (node24, GitHub
# REST API) to manage bot comments and labels — none of which run here.
# These checks only read the event payload, so plain bash is enough. The
# old "Flag unmergeable PRs" job is gone: Forgejo's PR view already shows
# merge conflicts natively.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  check-title:
    name: Check PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits: type(optional-scope)(optional !): summary
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([[:alnum:] ._/-]+\))?!?: .+'; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title is not in Conventional Commits format: \"$TITLE\""
            echo "Expected: type(scope): summary"
            echo "Example:  fix(search): handle empty query"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi

  check-description:
    name: Check PR description
    runs-on: ubuntu-latest
    steps:
      - name: Validate description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Require a real description: strip HTML comments (template
          # placeholders) and demand some substance. The old GitHub bot
          # validated individual template sections and posted comments;
          # for a single-maintainer Forgejo a non-trivial body is enough.
          stripped=$(echo "$BODY" | sed -E 's/<!--[^>]*-->//g' | tr -d '[:space:]')
          if [ "${#stripped}" -lt 40 ]; then
            echo "::error::PR description is empty or too short — describe what changed, why, and how to test it."
            exit 1
          fi
          echo "PR description OK (${#stripped} chars of content)."
